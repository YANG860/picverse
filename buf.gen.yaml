version: v2

managed:
  enabled: true
  disable:
    - file_option: go_package_prefix
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: rednote/gen/go

plugins:

  - remote: buf.build/connectrpc/go:v1.20.0
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative

  # 前端 playground 用：ESM 消息与类型（js 运行时 + d.ts 类型声明）
  - remote: buf.build/bufbuild/es
    out: gen/ts
    opt:
      - target=js+dts
      - import_extension=.js
  # ConnectRPC 客户端（面向前端 fetch/浏览器传输层）
  - remote: buf.build/connectrpc/es:v1.6.1
    out: gen/ts
    opt:
      - target=js+dts
      - import_extension=.js
