version: v2

managed:
  enabled: true
  disable:
    - file_option: go_package_prefix
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: rednote/gen/go

plugins:

  - remote: buf.build/connectrpc/go:v1.20.0
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative

  # 前端代码：输出到 web/src/gen（生成物必须位于 web 依赖树内，
  # 否则裸导入 @bufbuild/protobuf 无法从 gen/ 向上解析 node_modules）
  - remote: buf.build/bufbuild/es:v2.17.0
    out: web/src/gen
    # 生成依赖（protovalidate 的 buf/validate/validate_pb）的 TS 产物，否则 import 悬空
    include_imports: true
    opt:
      - target=js+dts
      - import_extension=.js
  # ConnectRPC 客户端（面向前端 fetch/浏览器传输层）
  - remote: buf.build/connectrpc/es:v1.6.1
    out: web/src/gen
    opt:
      - target=js+dts
      - import_extension=.js
