# Promtail：采集业务进程日志 + 容器日志 → 推送 Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 1s
      max_period: 5m
      max_retries: 10

scrape_configs:
  # 业务进程日志：~/rednote/*.log（slog JSON 为主，少量纯文本）
  - job_name: rednote
    static_configs:
      - targets:
          - localhost
        labels:
          job: rednote
          host: tencent2
          __path__: /var/log/rednote/*.log
    # filename / service_name 标签由 promtail 自动注入，无需手动 relabel
    pipeline_stages:
      # slog JSON 行：提取 level/name/msg 为标签（纯文本行解析失败不影响原文采集）
      - json:
          expressions:
            level: level
            name: name
      - labels:
          level:
          name:

  # 容器日志：通过 docker.sock 自动发现 5 个中间件容器
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
    pipeline_stages:
      # docker json-file 日志格式解析，提取日志正文与流（stdout/stderr）
      - docker: {}
