# 配置说明见 doc/config/config.md
# 测试服务器：106.53.172.186
# 认证信息已按测试环境填写（docker 容器：rednote-pg / rednote-nats / rednote-minio）
# 注意：真实凭据勿提交到公开仓库；生产环境改用环境变量/密钥管理注入

snowflake:
  # 雪花节点 ID（0–1023），多实例部署时需互不相同
  id: 1

database:
  pg:
    # PostgreSQL 连接串（容器 rednote-pg，库 prod）
    url: "postgres://postgres:wV5r46Z3yyumNjIRjzeaXqLGSMVYEjkd@106.53.172.186:5432/prod?sslmode=disable"

server:
  # 各服务监听地址（多进程共用同一配置文件，各服务取自己的条目）
  auth: ":8081"
  user: ":8083"
  media: ":8080"
  post: ":8082"
  bff: ":8084"
  discover: ":8085"
  # 调试开关：true 时 bff 挂 gRPC 服务端反射（grpcurl / buf curl 免 schema 直查）；
  # 反射暴露服务/消息元数据，生产面客端口应关闭
  reflection: true
  rate_limit: # 入口限流（仅 bff 消费；0 = 关闭该项）：token bucket 两级，溢出 fail+InternalError
    qps: 500     # 全局每秒请求数
    burst: 1000  # 全局突发桶容量
    ip_qps: 50   # 每 IP 每秒请求数（防单客户端刷量）
    ip_burst: 100 # 每 IP 突发桶容量

services:
  # 下游服务地址（packages/discovery 静态实现）。
  # 服务与本进程同机部署时用 127.0.0.1；跨机改为部署机地址；上 k8s 改为 Service DNS 名
  auth: "127.0.0.1:8081"
  user: "127.0.0.1:8083"
  media: "127.0.0.1:8080"
  post: "127.0.0.1:8082"
  discover: "127.0.0.1:8085"

rpc:
  timeout: 3s # 下游 RPC 单次调用超时（客户端拦截器统一注入，只收紧不放宽；超时=故障信号）
  max_inflight: 256 # 每下游服务在途请求并发上限（舱壁限流，满舱快速失败；堆积上界 = max_inflight × timeout）

s3:
  endpoint: "106.53.172.186:9000"   # 服务端内部读写（Upload/Download/Delete）直连，不经公网
  access_key: "rednote-3e2533eb"   # 容器 rednote-minio（MINIO_ROOT_USER）
  secret_key: "LwFebgYHVFg2JRaO18iprgHPe5BQgpXv8okatw9"
  region: "us-east-1"
  use_ssl: false
  bucket: "rednote"
  # 预签名 URL 的对外域名。SigV4 的 canonical host 参与签名，签名 URL 的 host 不能事后替换，
  # 因此签名以该域名为 endpoint 重新签发（服务端读写仍走上面的 endpoint）。留空=回落 endpoint。
  public_endpoint: "media.picverse.site"
  public_use_ssl: true

jetstream:
  url: "nats://106.53.172.186:4222"

redis:
  addr: "106.53.172.186:6379"
  password: ""     # 留空；redis 容器见 scripts/compose/docker-compose.yml
  db: 0
  pool_size: 10    # 0 表示使用默认值（10）

meili:
  # Meilisearch 搜索引擎（搜推服务的索引同步与查询）
  url: "http://106.53.172.186:7700"
  api_key: "rednote-meili-8f2c1d4a"   # 容器 rednote-meili（MEILI_MASTER_KEY）

cache:
  enabled: false   # 缓存总开关：部署 redis 容器后置 true；false 时不连接 redis，行为与无缓存一致
  profile_ttl: 30m # 用户资料缓存 TTL（±10% 抖动防雪崩）
  post_ttl: 30m    # 帖子详情缓存 TTL（±10% 抖动防雪崩）
  null_ttl: 60s    # 空哨兵 TTL（防穿透）
  timeline_ttl: 720h     # 作者发件箱缓存 TTL（30 天，与 fanout.retention 对齐：零漏前提，改须同步）
  timeline_capacity: 5000 # 发件箱缓存条数保险丝（防事故刷帖）；窗口 = fanout.retention 时间截尾（承诺内全量，短取即见底免回源），正常永不触发
  flight_workers: 4      # 回源合并并发批上限 K（1 退回串行波；调大消队头阻塞、吞吐天花板 ×K，代价合并率下降）
  flight_batch_size: 500 # 回源合并单批 key 上限（积压自动切分多批，防大包）
  flight_timeout: 5s     # 回源合并单批 fetch 超时（防挂死毒化底线）
  stat_ttl: 1m           # 统计列缓存 TTL（短 TTL 读缓存，写路径不失效，陈旧 ≤ TTL）；0=默认 1m，负值=禁用直通

post:
  view_flush_interval: 30s # 浏览计数刷回周期（Redis 计数器 → posts.view_count）

bigv:
  # 发帖侧分流判定（doc/internal/discover/discover.md）
  promote_followers: 5000  # 晋升线：粉丝数 ≥ 该值写发件箱缓存走 pull，否则扇出收件箱
  mark_ttl: 168h          # 大V标识 TTL（防抖动保持窗，7 天）：晋升后至少该时长维持大V供给，抖动不切换；跌破线后自然过期回归扇出

fanout:
  # 收件箱（fanout_timelines）保留期清理，维护表大小（doc/internal/discover/discover.md）
  retention: 720h        # 保留期按帖子时间（post_created_at），30 天；过期行由清理任务回收
  cleanup_interval: 1h   # 清理任务运行周期

hot:
  # 热榜池（rn:v1:hot:posts）维护任务与热度分（doc/internal/discover/plan_recommend_hot.md）
  refresh_interval: 10m  # 维护周期（整池重建：入池/算分/淘汰/TTL 续期）
  window: 168h           # 候选时间窗（7 天；窗口外帖子自然出池）
  ttl: 30m               # 池 key TTL 兜底（维护停摆消亡，随写入续期）
  hard_cap: 500000       # 池容量事故保险丝（候选超限按分数截尾，正常永不触发）
  gravity: 1.5           # 热度分时间衰减陡度（越大越偏重新帖）
  weights:               # 热度分信号权重（engagement = Σ w·ln(1+count)）
    like: 1.0
    favourite: 1.5
    comment: 2.0
    view: 0.1

recommend:
  # 推荐流（GetRecommendFeed）参数（doc/internal/discover/plan_recommend_hot.md）
  seen_ttl: 720h              # seen 已曝光去重窗口（30 天；账本 key TTL 随记账滚动续期）
  scan_batch_factor: 3        # 候选扫描批次 = limit × factor（预留 seen/打散过滤跳过）
  scatter_window: 3           # 同作者打散滑窗（窗内同作者 ≤ 1）
  explore_ratio: 0.1          # 探索位比例（每页随机采样条数占比，至少 1 条）

jwt:
  secret: "a8de244a1570e97d9e07f9144c78ca7bfe2ed303c7846c32f1201a2d22e2184e"  # HMAC-SHA256 密钥，必填
  issuer: "rednote"
  access_expire: 24h
  refresh_expire: 168h

poller:
  workers: 4
  # 轮询间隔：越低越能压低「事务 outbox → 消息投递」的时延（媒体上传链路要过 outbox 跳，
  # 每跳平均等待 interval/2）。500ms 下 4 worker 空闲轮询仅 8 次/秒走分区索引，代价可忽略
  interval: 500ms
  batch_size: 100
  max_retry: 5
  publish_timeout: 10s

consumer:
  handle_timeout: 30s # 单条消息处理超时（防挂死阻塞消息循环），超时 Nak 重投
  media:
    name: "media_consumer"
    max_retry: 5
    working_dir: "./tmp/media_work"
  post:
    name: "post_consumer"
    # 投递上限须覆盖媒体就绪时延：NakWithDelay 逐条退避 1s/2s/3s/5s…，8 次投递≈ 26s 窗口 > 媒体 UPLOADING→ACTIVE
    # 实测 ~16s（发布后审计碰媒体在途）。窗口耗尽会回退 DRAFT（不会丢消息），但不应因窗口偏短误伤正常发布
    max_retry: 8
    working_dir: "./tmp/post_work"
  discover:
    index:                 # 索引同步（Meili posts 索引）
      name: "discover_index_consumer"
      max_retry: 5
    fanout:                # 关注流扇出（大V判定/发件箱缓存/收件箱扩散）
      name: "fanout_consumer"
      max_retry: 5

logger:
  level: "info"
  file: true
  out: "./logs/app.log"
  rotate: true
  maxsize: 100        # 单文件最大 MB
  maxbackups: 7       # 保留旧文件数
  maxage: 28          # 保留天数
  compress: false
  buffersize: 262144  # 256KB
  std: true
