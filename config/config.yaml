    name: "media_consumer"
    max_retry: 5
    working_dir: "./tmp/media_work"

logger:
  level: "info"
  file: true
  out: "./logs/app.log"
  rotate: true
  maxsize: 100        # 单文件最大 MB
  maxbackups: 7       # 保留旧文件数
  maxage: 28          # 保留天数
  compress: false
  buffersize: 262144  # 256KB
  std: true
