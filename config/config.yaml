  region: "us-east-1"
  use_ssl: false
  bucket: "rednote"

jetstream:
  url: "nats://106.53.172.186:4222"

redis:
  addr: "106.53.172.186:6379"
  password: ""     # 留空——未部署 redis 容器（当前代码未实际使用 redis）
  db: 0
  pool_size: 10    # 0 表示使用默认值（10）

jwt:
