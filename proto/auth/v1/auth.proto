syntax = "proto3";

package auth.v1;

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ADMIN = 2;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_MOBILE = 1;
  PLATFORM_WEB = 3;
}

message AccessToken {
  string value = 1;
}

message RefreshToken {
  string value = 1;
}

message Credential {
  string email = 1;
  string password = 2;
}
