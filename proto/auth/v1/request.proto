syntax = "proto3";

package auth.v1;

import "auth/v1/auth.proto";
import "buf/validate/validate.proto";
import "common/v1/common.proto";

message RegisterRequest {
  Credential credential = 1;
  Role role = 2;
}

message RegisterResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  string assigned_id = 3;
}

message LoginRequest {
  Credential credential = 1;
  Platform platform = 2;
}

message LoginResponse {
  bool fail = 1;
  common.v1.Error err = 2;
  RefreshToken refresh_token = 3;
  AccessToken access_token = 4;
}

// 换发 refresh token：会话凭据（refresh token 串）由内部 RPC 请求体直传，
// auth 自行验签后取 uid/jti 做轮换校验，不再经 ctx/header 透传 claims
message GetRefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message GetRefreshTokenResponse {
  bool fail = 2;
  common.v1.Error err = 3;

  RefreshToken token = 1;
}

// 换发 access token：会话凭据（refresh token 串）由请求体直传，auth 验签后校验 jti 有效性
message GetAccessTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message GetAccessTokenResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  AccessToken token = 3;
}

message LogoutRequest {
  // 会话 uid，由 BFF 从会话解析后注入（内部 RPC 直传，内网互信）
  string uid = 2 [(buf.validate.field).string.min_len = 1];
  Platform platform = 1;
}

message LogoutResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}

// DeleteAccountRequest 删除账户（内部接口：BFF 注册编排回滚用，不经 BFF 面客）。
// 物理删除注册记录，一并失效其 web/mobile refresh 登录态。
message DeleteAccountRequest {
  // 待删除账户的 uid（注册时分配的 assigned_id）
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteAccountResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}
