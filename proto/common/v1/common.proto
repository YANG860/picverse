syntax = "proto3";

package common.v1;

import "buf/validate/validate.proto";

message Empty {}

message Error {
  string msg = 1;
  int64 code = 2;
}

message Cursor {
  string str = 2;
  int64 limit = 1 [(buf.validate.field).int64.lt = 1000];
}

message BaseModel {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  int64 created_at = 2;
  int64 updated_at = 3;
}
