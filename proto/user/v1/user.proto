syntax = "proto3";

package user.v1;

import "common/v1/common.proto";
import "media/v1/media.proto";

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_BANNED = 2;
  USER_STATUS_DELETED = 3;
}

message UserProfile {
  UserBrief brief = 1;
  string bio = 2;
  UserStat stat = 3;
  UserStatus status = 5;

  common.v1.JsonStr metadata = 4;
}

message UserStat {
  int64 followers = 1;
  int64 followings = 2;
}

message UserBrief {
  media.v1.MediaFile avatar = 1;
  string name = 2;
  string uid = 3;
}
