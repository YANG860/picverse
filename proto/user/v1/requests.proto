syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "google/protobuf/wrappers.proto";
import "media/v1/media.proto";
import "user/v1/user.proto";

// ==================== 用户 ====================
// 创建用户资料
// uid 由鉴权服务注册时分配（RegisterResponse.assigned_id），此处透传
message CreateUserRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];

  media.v1.MediaFile avatar = 3;
  string bio = 4;

  common.v1.JsonStr metadata = 5;
}

message CreateUserResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  UserProfile profile = 3;
}

message UpdateUserProfileRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];

  google.protobuf.StringValue name = 2;
  google.protobuf.StringValue bio = 4;
  common.v1.JsonStr metadata = 5;
}

message UpdateUserProfileResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  UserProfile profile = 3;
}

message UpdateUserAvatarRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  media.v1.MediaFile avatar = 2;
}

message UpdateUserAvatarResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  UserProfile profile = 3;
  string old_asset_id = 4; // 返回旧的asset id 用于bff修改引用计数
}

message GetUserBriefRequest {
  repeated string uids = 1 [(buf.validate.field).repeated.items.string.min_len = 1];
}
message GetUserBriefResponse {
  repeated UserBriefResult results = 1;
}

message UserBriefResult {
  bool fail = 1;
  common.v1.Error err = 2;

  UserBrief brief = 3;

  // 回填请求的 uid，便于调用方定位失败项（与 media.v1.MediaAssetResult.id 语义一致）
  string uid = 4 [(buf.validate.field).string.min_len = 1];
}

message GetUserProfileRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

message GetUserProfileResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  UserProfile profile = 3;
}

message GetUserStatusRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

message GetUserStatusResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  UserStatus status = 3;
}

message BanUserRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

message BanUserResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}

message SetFollowRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string target_uid = 2 [(buf.validate.field).string.min_len = 1];
}

message SetFollowResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}

message SetUnFollowRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string target_uid = 2 [(buf.validate.field).string.min_len = 1];
}

message SetUnFollowResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}

message GetFollowingsRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  common.v1.Cursor cursor = 2;
}

message GetFollowingsResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  repeated UserBrief user_briefs = 3;
  common.v1.Cursor cursor = 4;
}

// GetFollowersRequest 获取粉丝列表（游标分页，按关注时间倒序，与 GetFollowings 对称）
message GetFollowersRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  common.v1.Cursor cursor = 2;
}

message GetFollowersResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  // 翻页到底/暂无粉丝：列表为空且 cursor 为空（与 GetFollowingsResponse 一致）
  repeated UserBrief user_briefs = 3;
  common.v1.Cursor cursor = 4;
}

message GetFollowingRelationRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string target_uid = 2 [(buf.validate.field).string.min_len = 1];
}

message GetFollowingRelationResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  bool is_following = 3;
  bool is_follower = 4;
}
