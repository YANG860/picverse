syntax = "proto3";

package media.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";

enum MediaAssetStatus {
  MEDIA_ASSET_STATUS_UNSPECIFIED = 0;
  MEDIA_ASSET_STATUS_UPLOADING = 1;
  MEDIA_ASSET_STATUS_AUDITING = 2;
  MEDIA_ASSET_STATUS_PROCESSING = 5;
  MEDIA_ASSET_STATUS_ACTIVE = 3;
  MEDIA_ASSET_STATUS_FAILED = 4;
  MEDIA_ASSET_STATUS_BANNED = 7;
  MEDIA_ASSET_STATUS_ERROR = 6;
  MEDIA_ASSET_STATUS_DELETED = 8;
}

enum MediaFileType {
  MEDIA_FILE_TYPE_UNSPECIFIED = 0;
  MEDIA_FILE_TYPE_ORIGIN = 1;
  MEDIA_FILE_TYPE_216 = 2;
  MEDIA_FILE_TYPE_540 = 3;
  MEDIA_FILE_TYPE_1080 = 4;
}
enum MediaFormat {
  MEDIA_FORMAT_UNSPECIFIED = 0;
  MEDIA_FORMAT_PNG = 1;
  MEDIA_FORMAT_JPG = 2;
  MEDIA_FORMAT_WEBP = 3;
}

message MediaAsset {
  common.v1.BaseModel base = 1;
  MediaAssetStatus status = 4;
  int64 ref_count = 5;
  string uploader_id = 6;
}

message MediaFile {
  common.v1.BaseModel base = 1;
  string asset_id = 2 [(buf.validate.field).string.min_len = 1];
  MediaFileType type = 5;

  string obj_key = 6;
  string bucket = 7;

  MediaMetaData meta = 8;
}

message MediaMetaData {
  string sha_256_sum = 8;
  int64 size_bytes = 9;

  MediaFormat format = 3;
  int64 height = 10;
  int64 width = 11;

  bytes metadata = 12;
}
