syntax = "proto3";

package media.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "media/v1/media.proto";

message UploadMediaRequest {
  string uploader_id = 1;

  MediaMetaData media_meta = 3;
}

message UploadMediaResponse {
  bool fail = 3;
  common.v1.Error err = 4;

  MediaAsset asset = 1;
  string signed_url = 2;
  int64 expire_at = 5;
}

message GetMediaAssetsRequest {
  repeated string ids = 1 [(buf.validate.field).repeated.items.string.min_len = 1];
}

message GetMediaAssetsResponse {
  repeated MediaAssetResult results = 1;
}

message MediaAssetResult {
  bool fail = 1;
  common.v1.Error err = 2;

  string id = 3 [(buf.validate.field).string.min_len = 1];

  MediaAsset asset = 4;
}

// 获取单个媒体资产的元数据（GetMediaAssets 的单值版本）
message GetMediaAssetRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetMediaAssetResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  MediaAsset asset = 3;
}

message GetMediaAssetFilesRequest {
  repeated MediaAssetFileQuery queries = 1;
}

message GetMediaAssetFilesResponse {
  repeated MediaAssetFileResult files = 1;
}

message MediaAssetFileQuery {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  MediaFileType type = 2;
}

message MediaAssetFileResult {
  bool fail = 1;
  common.v1.Error err = 2;

  MediaAssetFileQuery query = 4;

  MediaFile file = 5;
}

// 获取单个媒体资产下的文件（GetMediaAssetFiles 的单值版本）
message GetMediaAssetFileRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  MediaFileType type = 2;
}

message GetMediaAssetFileResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  MediaFile file = 3;
}

// MediaFileURL 单条展示 URL 签名结果（逐项 fail 标识该项失败）
message MediaFileURL {
  bool fail = 1;
  common.v1.Error err = 2;

  string asset_id = 3 [(buf.validate.field).string.min_len = 1];
  MediaFileType type = 4;

  string signed_url = 5;
  // 签名 URL 过期时间：unix 毫秒时间戳
  int64 expire_at = 6;
}

// 批量签发展示 GET URL（纯读，不改引用计数；URL 供前端直接展示媒体）
message SignMediaFileURLsRequest {
  repeated MediaAssetFileQuery refs = 1 [(buf.validate.field).repeated.min_items = 1];
}

message SignMediaFileURLsResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  repeated MediaFileURL urls = 3;
}

message ListMediaAssetsBeforeRequest {
  common.v1.Cursor cursor = 1;
}

message ListMediaAssetsBeforeResponse {
  bool fail = 3;
  common.v1.Error err = 4;

  repeated MediaAsset assets = 1;
  common.v1.Cursor cursor = 2;
}

message BanMediaRequest {
  string asset_id = 1;
}

message BanMediaResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}

// 原子接口 全部成功或全部失败
message ModifyMediaAssetRefCountRequest {
  repeated ModifyMediaAssetRefCountQuery queries = 1;
}

message ModifyMediaAssetRefCountResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}

message ModifyMediaAssetRefCountQuery {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  sint64 delta = 2;
}

message DeleteUnusedMediaRequest {
  int64 limit = 1;
}

message DeleteUnusedMediaResponse {
  bool fail = 2;
  common.v1.Error err = 3;

  int64 rows_affected = 1;
}
