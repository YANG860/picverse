syntax = "proto3";

package post.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "google/protobuf/wrappers.proto";
import "media/v1/media.proto";
import "post/v1/post.proto";

// ==================== 草稿 ====================

// 创建草稿
message CreateDraftRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];

  string title = 2;
  string full_text = 3;
  // 媒体列表必填：至少 1 张（所有帖子至少有一个封面图，首张即封面）
  // 媒体的存在性/归属校验与资产引用计数由 BFF 维护，本服务只存关联不校验（见 UpdateDraftMediasResponse.old_asset_ids）
  repeated media.v1.MediaFile medias = 4 [(buf.validate.field).repeated.min_items = 1];

  common.v1.JsonStr metadata = 5;
}

message CreateDraftResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  Post draft = 3;
}

// UpdateDraftRequest 更新草稿（文本字段部分更新：仅更新传入的字段，nil 字段不修改；仅 DRAFT 状态可更新）
// 媒体更新拆分至 UpdateDraftMediasRequest
message UpdateDraftRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string post_id = 2 [(buf.validate.field).string.min_len = 1];

  google.protobuf.StringValue title = 3;
  google.protobuf.StringValue full_text = 4;
  common.v1.JsonStr metadata = 5;
}

message UpdateDraftResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  Post post = 3;
}

// UpdateDraftMediasRequest 更新草稿媒体（全量替换：至少 1 张，不支持清空，首张即封面；仅 DRAFT 状态可更新）
// 媒体的存在性/归属校验与资产引用计数由 BFF 维护，本服务只存关联不校验
message UpdateDraftMediasRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string post_id = 2 [(buf.validate.field).string.min_len = 1];

  repeated media.v1.MediaFile medias = 3 [(buf.validate.field).repeated.min_items = 1];
}

message UpdateDraftMediasResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  Post post = 3;
  // 被替换的旧媒体所属资产 ID（BFF 据此调整资产引用计数，首次设置媒体时为空）
  repeated string old_asset_ids = 4;
}

// 发布草稿（要求草稿内所有图片审核通过——占位：该校验暂未实现，待审核链路完善后补）
// 成功后状态 DRAFT → AUDITING，异步审核通过后 → POST_STATUS_PUBLISHED
message PublishDraftRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string post_id = 2 [(buf.validate.field).string.min_len = 1];
}

message PublishDraftResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}

// ==================== 帖子查询 ====================

// 按ID批量获取帖子（内部接口，BFF 内网调用；本身就无鉴权/可见性过滤，返回任意状态的帖子）
message GetPostsByIDsRequest {
  repeated string post_ids = 1 [(buf.validate.field).repeated.items.string.min_len = 1];
}

message GetPostsByIDsResponse {
  repeated PostResult results = 1;
}

// PostBriefResult PostBrief 逐条结果（key = post_id 定位；fail 提示该条不可见/非法）
message PostBriefResult {
  bool fail = 1;
  common.v1.Error err = 2;

  string post_id = 3 [(buf.validate.field).string.min_len = 1];
  PostBrief post = 4;
}

// ViewPostsByIDsRequest 面客批量查看帖子（信息流等组装口径）：仅返回 PUBLISHED，
// 可见性裁决收敛服务端，调用方不自行过滤状态（与 GetPostsByIDs 内部取数（全状态）成对）。
message ViewPostsByIDsRequest {
  repeated string post_ids = 1 [(buf.validate.field).repeated.items.string.min_len = 1];
}

message ViewPostsByIDsResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  // 逐条结果（不保证与输入同序），key = post_id 定位：fail = 不可见/不存在（NotFound，
  // 不暴露状态存在性）/ 非法 id（InvalidID）；调用方按 post_id 对账，不依赖顺序
  repeated PostBriefResult results = 3;
}

message PostResult {
  bool fail = 1;
  common.v1.Error err = 2;

  string post_id = 3 [(buf.validate.field).string.min_len = 1];
  Post post = 4;
}

message GetPostStatusRequest {
  string post_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetPostStatusResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  PostStatus status = 3;
}

// 按作者游标分页获取帖子列表
message ViewPostByAuthorRequest {
  string viewer_id = 1 [(buf.validate.field).string.min_len = 1];
  string author_id = 3 [(buf.validate.field).string.min_len = 1];
  common.v1.Cursor cursor = 2;
}

message ViewPostByAuthorResponse {
  bool fail = 1;
  common.v1.Error err = 2;
  // 翻页到底：游标为空即到底（末页可带数据）——短取（< limit）即到底
  repeated PostBrief posts = 3;
  common.v1.Cursor cursor = 4;
}

message ViewPostRequest {
  string viewer_id = 2 [(buf.validate.field).string.min_len = 1];
  string post_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ViewPostResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  Post post = 3;
}

// ==================== 帖子管理 ====================

// 封禁帖子
message BanPostRequest {
  string post_id = 1 [(buf.validate.field).string.min_len = 1];
}

message BanPostResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}

// DeletePostRequest 删除帖子（用户删除自己的帖子，草稿与已发布均可删，软删）
message DeletePostRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string post_id = 2 [(buf.validate.field).string.min_len = 1];
}

message DeletePostResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}

// SyncPostStatRequest 同步帖子统计信息（异步链路调用：MQ 消费者 / 定时任务推送统计数据）。
// 逐字段部分更新（参考 UpdateUserProfileRequest 语义）：字段为 nil 表示不修改，设置则覆盖该统计列（含 0）；
// 所有字段均未设置 → InvalidArgument；计数必须非负；仅统计字段，不改帖子状态
message SyncPostStatRequest {
  string post_id = 1 [(buf.validate.field).string.min_len = 1];

  google.protobuf.Int64Value like_count = 2;
  google.protobuf.Int64Value favourite_count = 3;
  google.protobuf.Int64Value comment_count = 4;
  google.protobuf.Int64Value view_count = 5;
}

message SyncPostStatResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}

// ==================== 互动（点赞/收藏） ====================
// 口径：幂等（重复操作返回成功，计数不重复增减）；
// 仅 PUBLISHED 可互动（非 PUBLISHED 一律 NotFound，不泄露帖子状态）；
// 响应带最新计数（同事务返回）+ 状态位（动作后确定态，调用方同步本地集合）

// 点赞
message LikePostRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string post_id = 2 [(buf.validate.field).string.min_len = 1];
}

message LikePostResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  int64 like_count = 3;
  bool liked = 4;
}

// 取消点赞（幂等：未赞时返回成功，计数不变）
message UnlikePostRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string post_id = 2 [(buf.validate.field).string.min_len = 1];
}

message UnlikePostResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  int64 like_count = 3;
  bool liked = 4;
}

// 收藏（幂等；新增收藏校验容量上限 FavouriteCap，超限 FavouriteLimitExceeded 1306）
message FavouritePostRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string post_id = 2 [(buf.validate.field).string.min_len = 1];
}

message FavouritePostResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  int64 favourite_count = 3;
  bool favourited = 4;
}

// 取消收藏（幂等）
message UnfavouritePostRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string post_id = 2 [(buf.validate.field).string.min_len = 1];
}

message UnfavouritePostResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  int64 favourite_count = 3;
  bool favourited = 4;
}

// 最近点赞的帖子 ID（内部接口：前端批量预取判"已赞"态；created_at DESC 游标）
message ListLikedPostIDsRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  common.v1.Cursor cursor = 2;
}

message ListLikedPostIDsResponse {
  bool fail = 1;
  common.v1.Error err = 2;
  // 翻页到底：游标为空即到底（末页可带数据）——短取（< limit）即到底
  repeated string post_ids = 3;
  common.v1.Cursor cursor = 4;
}

// 收藏的帖子 ID（内部接口：全量收藏预取判"已藏"态；FavouriteCap 内一页可拉全，created_at DESC 游标）
message ListFavouritePostIDsRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  common.v1.Cursor cursor = 2;
}

message ListFavouritePostIDsResponse {
  bool fail = 1;
  common.v1.Error err = 2;
  // 翻页到底：游标为空即到底（末页可带数据）——短取（< limit）即到底
  repeated string post_ids = 3;
  common.v1.Cursor cursor = 4;
}

// ==================== 评论 ====================
// 口径：仅 PUBLISHED 可评论/可读（非 PUBLISHED 一律 NotFound，不泄露帖子状态）；
// 内容非空且 ≤ 500 rune（utils.ValidateComment）；
// 删除软删、幂等（重复删除返回成功且不重复减计数），删一级评论级联软删整楼；
// 响应带帖子最新 comment_count（同事务返回）

// 发表一级评论（追加型，无幂等语义）
message CreateCommentRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string post_id = 2 [(buf.validate.field).string.min_len = 1];
  string content = 3 [(buf.validate.field).string.min_len = 1];
}

message CreateCommentResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  Comment comment = 3;
  // 帖子最新总评论数（一级 + 回复，同事务返回）
  int64 comment_count = 4;
}

// 回复（楼中楼：挂在 parent 所在楼层；parent 可以是回复，展示 @reply_to）。
// parent 必须存在、同帖、未删，否则 NotFound
message ReplyCommentRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string post_id = 2 [(buf.validate.field).string.min_len = 1];
  // 被回复评论 id（一级评论或楼内回复均可）
  string parent_id = 3 [(buf.validate.field).string.min_len = 1];
  string content = 4 [(buf.validate.field).string.min_len = 1];
}

message ReplyCommentResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  Comment comment = 3;
  int64 comment_count = 4;
}

// 删除评论（软删；评论作者或帖子作者可删，否则 Forbidden）。
// 删一级评论级联软删整楼；按实际删除行数回收计数；重复删除成功幂等
message DeleteCommentRequest {
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  string comment_id = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteCommentResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  // 帖子最新总评论数
  int64 comment_count = 3;
  // 动作后态（幂等重复删除也报 true）
  bool deleted = 4;
}

// 帖子一级评论分页（created_at DESC 时间游标）
message ListCommentsRequest {
  string post_id = 1 [(buf.validate.field).string.min_len = 1];
  common.v1.Cursor cursor = 2;
}

message ListCommentsResponse {
  bool fail = 1;
  common.v1.Error err = 2;
  // 翻页到底：游标为空即到底（末页可带数据）——短取（< limit）即到底
  repeated Comment comments = 3;
  common.v1.Cursor cursor = 4;
}

// 楼内回复分页（root_id = 楼层 id；平铺含"回复的回复"，带 reply_to_user_id 供 @展示，created_at DESC 时间游标）
message ListRepliesRequest {
  string root_id = 1 [(buf.validate.field).string.min_len = 1];
  common.v1.Cursor cursor = 2;
}

message ListRepliesResponse {
  bool fail = 1;
  common.v1.Error err = 2;
  // 翻页到底：游标为空即到底（末页可带数据）——短取（< limit）即到底
  repeated Comment replies = 3;
  common.v1.Cursor cursor = 4;
}
