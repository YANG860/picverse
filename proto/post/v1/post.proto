syntax = "proto3";

package post.v1;

import "common/v1/common.proto";
import "media/v1/media.proto";

message PostBrief {
  string post_id = 6;

  media.v1.MediaFile cover = 2;
  string title = 1;

  string author_id = 3;
  PostStat stat = 5;

  string created_at = 4;

  // 帖子状态（BFF 组装 PostCard 直接使用，避免二次查询）：
  // 他人视角恒为 PUBLISHED，作者视角含草稿/审核中
  PostStatus status = 7;
}

message PostStat {
  int64 like_count = 1;
  int64 favourite_count = 2;
  int64 comment_count = 3;
  int64 view_count = 4;
}

message Post {
  string post_id = 6;
  string created_at = 4;
  string updated_at = 7;

  repeated media.v1.MediaFile medias = 2;
  string title = 1;
  string full_text = 8;

  string author_id = 3;
  PostStat post_stat = 5;
  common.v1.JsonStr metadata = 9;

  PostStatus status = 10;
}

enum PostStatus {
  POST_STATUS_UNSPECIFIED = 0;
  POST_STATUS_DRAFT = 1;
  POST_STATUS_AUDITING = 2;
  POST_STATUS_PUBLISHED = 3;
  POST_STATUS_BANNED = 4;
  POST_STATUS_DELETED = 5;
}

// Comment 评论（两级楼中楼：一级评论 + 回复，回复间平级、parent_id 指向被回复者）。
// root_id 恒为楼层 id（一级评论 = 自身 comment_id）；parent_id / reply_to_user_id 一级评论为空串。
// 软删行不出现在任何列表/详情，status 不面客。
message Comment {
  string comment_id = 1;
  string post_id = 2;

  // 楼层 id（一级评论 = 自身 comment_id）
  string root_id = 3;
  // 被回复评论 id（一级评论为空串；回复的回复指向楼内被回复的那条）
  string parent_id = 4;

  string user_id = 5;
  // 被回复者 uid（一级评论为空串），展示 @name 用
  string reply_to_user_id = 6;

  string content = 7;
  // 楼层回复数（仅一级评论有意义，回复恒 0）
  int64 reply_count = 8;
  // 创建时间：unix 毫秒时间戳的字符串形式，同 Post.created_at 口径
  string created_at = 9;
}

// 评论状态（NORMAL / DELETED 软删；BANNED 为枚举位预留，暂不使用）
enum CommentStatus {
  COMMENT_STATUS_UNSPECIFIED = 0;
  COMMENT_STATUS_NORMAL = 1;
  COMMENT_STATUS_DELETED = 2;
}
