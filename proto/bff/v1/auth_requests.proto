syntax = "proto3";

package bff.v1;

import "auth/v1/auth.proto";
import "buf/validate/validate.proto";
import "common/v1/common.proto";

// RegisterRequest 注册（成功不签发令牌，注册后需另行 Login）。
// 与内部 auth 服务的差异：角色由 BFF 固定为 ROLE_USER，不暴露给客户端。
// 能力范围仅“开户”（email/password/name）：注册前无 uid/无会话无法上传媒体，
// 头像由 BFF 挂默认头像资产（packages/defaults.AvatarAssetID，引用计数 +1）；
// 头像个性化由登录后的 UploadMedia → UpdateMyAvatar 完成（归属校验完备）。
message RegisterRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 1];
  // 昵称（必填，1~64 字符，与 user.CreateUser 的 name 校验对齐）
  string name = 3 [(buf.validate.field).string.min_len = 1];
}

message RegisterResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}

// LoginRequest 登录（uid 由签发的令牌承载，不在请求体内）。
message LoginRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 1];
  auth.v1.Platform platform = 3;
}

message LoginResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  auth.v1.AccessToken access_token = 3;
  auth.v1.RefreshToken refresh_token = 4;
}

// RefreshTokensRequest 刷新令牌。
// 请求体为空：refresh token 由 BFF 从请求凭据中解析并透传给下游。
// refresh token 仅在临近过期（剩余寿命 < 1/2 总寿命）时才轮换，其余时候只换发 access token。
message RefreshTokensRequest {}

message RefreshTokensResponse {
  bool fail = 1;
  common.v1.Error err = 2;

  auth.v1.AccessToken access_token = 3;
  // 当前有效的 refresh token：轮换后为新值，未轮换时回填旧值，客户端可直接覆盖存储
  auth.v1.RefreshToken refresh_token = 4;
}

// LogoutRequest 登出当前会话用户（uid 来自会话）：失效全部平台的 refresh 登录态。
message LogoutRequest {
}

message LogoutResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}

// ChangePasswordRequest 修改密码（uid 来自会话）：校验旧密码后换写新密码。
// 成功后失效该账号全部平台（含当前会话）的 refresh 登录态，所有设备需重新登录。
message ChangePasswordRequest {
  // 旧密码（明文）
  string old_password = 1 [(buf.validate.field).string.min_len = 1];
  // 新密码（明文，强度校验同 Register：8~32 位含大小写字母与数字）
  string new_password = 2 [(buf.validate.field).string.min_len = 1];
}

message ChangePasswordResponse {
  bool fail = 1;
  common.v1.Error err = 2;
}
