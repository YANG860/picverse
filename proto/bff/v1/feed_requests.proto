syntax = "proto3";

package bff.v1;

import "bff/v1/views.proto";
import "common/v1/common.proto";

// GetFollowingFeedRequest 关注流：我关注的人的已发布帖子，按发布时间归并（游标分页）。
// 推荐流由后续推荐服务另立接口，不复用本契约。
message GetFollowingFeedRequest {
  common.v1.Cursor cursor = 1;
}

message GetFollowingFeedResponse {
  bool fail = 1;
  common.v1.Error err = 2;
  // 翻页到底：游标为空即到底（末页可带数据）——短取（< limit）即到底
  repeated PostCard posts = 3;
  common.v1.Cursor cursor = 4;
}

// GetHotPostsRequest 热榜：全局热门帖子排行（热度降序，可重复看的榜单，不做去重/个性化）。
message GetHotPostsRequest {
  common.v1.Cursor cursor = 1;
}

message GetHotPostsResponse {
  bool fail = 1;
  common.v1.Error err = 2;
  // 翻页到底：游标为空即到底（末页可带数据）——短取（< limit）即到底
  repeated PostCard posts = 3;
  common.v1.Cursor cursor = 4;
}

// GetRecommendFeedRequest 推荐流：已曝光去重 + 同作者打散 + 探索位的推荐信息流。
message GetRecommendFeedRequest {
  common.v1.Cursor cursor = 1;
}

message GetRecommendFeedResponse {
  bool fail = 1;
  common.v1.Error err = 2;
  // 翻页到底：游标为空才是到底——短取 ≠ 到底（本页不满可能仍有后续），继续翻页判定只看游标
  repeated PostCard posts = 3;
  common.v1.Cursor cursor = 4;
}
